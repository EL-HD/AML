# Configuración de Streamlit para Sovereign AML (se versiona; sin secretos).
# Seguridad (OWASP A05): protección XSRF activa (Streamlit exige enableCORS=true
# cuando XSRF está activo; la cookie _streamlit_xsrf limita los orígenes),
# subida máxima de 25 MB.

[server]
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 25
enableStaticServing = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "dark"
primaryColor = "#f59e0b"
backgroundColor = "#0f141b"
secondaryBackgroundColor = "#171c23"
textColor = "#dee2ed"
font = "sans serif"
