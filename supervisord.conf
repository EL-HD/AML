; ─────────────────────────────────────────────────────────────────────────────
; supervisord.conf: Sovereign AML · Railway single-service
;
; Proceso 1 (prioridad 10): FastAPI/uvicorn en 127.0.0.1:8000 (solo interno)
; Proceso 2 (prioridad 20): Streamlit en 127.0.0.1:8501 (solo interno)
; Proceso 3 (prioridad 30): Caddy en 0.0.0.0:%(ENV_PORT)s (expuesto; T5:
;   cabeceras de seguridad, compresión, WebSocket y healthcheck vía proxy)
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/tmp/supervisord.pid

; Socket UNIX para supervisorctl (útil para debug dentro del contenedor)
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ─── FastAPI (interno, solo loopback) ────────────────────────────────────────
[program:fastapi]
command=uvicorn auth_api:app --host 127.0.0.1 --port 8000 --workers 1
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Streamlit (interno, solo loopback; Caddy lo publica en $PORT) ───────────
[program:streamlit]
; El resto de la configuración (XSRF activo, CORS, maxUploadSize=25, tema)
; vive en .streamlit/config.toml, versionado en el repositorio.
command=streamlit run app.py
    --server.port 8501
    --server.address 127.0.0.1
    --server.headless true
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=15
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Caddy (expuesto en $PORT, por defecto 8080) ─────────────────────────────
[program:caddy]
; Configuración versionada en /app/Caddyfile (cabeceras, CSP, proxy a 8501).
; Arranca después de Streamlit; si Streamlit aún no responde, Caddy devuelve 502
; hasta que esté listo y el healthcheck de Railway espera (healthcheckTimeout).
command=caddy run --config /app/Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
